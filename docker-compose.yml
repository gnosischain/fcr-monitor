name: fcr-monitor

services:
  monitor:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3000"
    depends_on:
      - redis
    # Loopback only. Reach it with: ssh -L 3000:localhost:3000 <host>
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - fcr

  redis:
    image: redis:7-alpine
    # appendonly keeps tracked safe blocks and reorg history across restarts.
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - fcr

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - fcr

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      # The directory, not the two files individually: bind-mounting a file that
      # does not exist yet makes Docker silently create a *directory* at that
      # path. Mounting the parent means a missing slack_url is a clear startup
      # error instead. Create it from alertmanager/slack_url.example.
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    networks:
      - fcr

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    networks:
      - fcr

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:

networks:
  fcr:
    driver: bridge
# If the execution clients run as containers on this same host, the tighter
# setup is to drop their published 8545 ports entirely and join their network
# here instead, addressing them as http://<container-name>:8545. Replace the
# block above with:
#
# networks:
#   fcr:
#     driver: bridge
#   el:
#     external: true
#     name: <the network your EL containers are on>
#
# and add `- el` to the monitor service's networks list.
