global:
  resolve_timeout: 5m
  # Read from a file rather than inlined: the webhook URL is a credential —
  # anyone holding it can post to the channel — and this file is in git.
  slack_api_url_file: /etc/alertmanager/slack_url

route:
  # Default is to notify nobody. Every rule in prometheus/alerts.yml still
  # evaluates and is visible at :9090/alerts, but only the confirmed-block-reorged alert is
  # routed anywhere. Silence here is deliberate, not a missing receiver.
  receiver: blackhole

  routes:
    # Fallback events are discrete, not conditions that clear. Group by block so
    # two offending blocks never collapse into one message, and do not re-notify:
    # the block is already named in the first message.
    - matchers: [alertname="FcrConfirmedBlockReorged"]
      receiver: slack-fcr-fallback-event
      group_by: ['client', 'block_number']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 24h

receivers:
  - name: blackhole

  - name: slack-fcr-fallback-event
    slack_configs:
      # Modern Slack webhooks are bound to the channel they were created for and
      # ignore this field, but Alertmanager still requires it to be set.
      - channel: '#fcr-alerts'
        # No resolved notification. The announcement expiring means the alerting
        # window closed, not that the event was undone — a ✅ would misread.
        send_resolved: false
        title: '🔴 Confirmed block reorged out — {{ .CommonLabels.client }}'
        text: |-
          {{ range .Alerts }}{{ .Annotations.summary }}
          • *block* `{{ .Labels.block_number }}`
          • *recorded* `{{ .Labels.recorded_hash }}`
          • *actual* `{{ .Labels.observed_hash }}`
          {{ end }}
