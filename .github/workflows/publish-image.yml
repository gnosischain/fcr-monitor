name: publish-image

# Builds the container image and pushes it to Gnosis' Artifact Registry.
#
# Deliberately does NOT deploy. The image tag is pinned by digest in the
# infrastructure repo and bumped by a reviewed PR, so this pipeline needs no
# access to the GKE cluster and no `roles/container.developer`. The blast radius
# of a compromised workflow is therefore "can push an image nobody deployed".
#
# Infra: production/google/deployments/gnosis-chain/mainnet/tools/fcr-monitor/

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top level. Only the `publish` job re-declares
# permissions and adds `id-token: write`, so no other job can mint an OIDC token
# that Google Cloud would trust.
permissions:
  contents: read

# Pushes are grouped by commit, not by ref, so a release tag pushed straight
# after a merge queues behind main's run for that commit instead of racing it
# (the tag run needs main's image to exist). Pull requests keep grouping by
# ref: their github.sha is a fresh merge commit per push, so grouping by it
# would stop superseded PR runs being cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AR_HOST: europe-west1-docker.pkg.dev
  IMAGE: europe-west1-docker.pkg.dev/gnosischain-production/fcr-monitor/fcr-monitor
  # Single-arch on purpose: every node pool on gnosischain-nodes is x86_64.
  # Verify with:
  #   gcloud container node-pools list --cluster gnosischain-nodes \
  #     --region europe-west1 --format='table(name,config.machineType)'
  PLATFORMS: linux/amd64

jobs:
  # ---------------------------------------------------------------------------
  # verify — runs on pull requests too, including from forks. Holds no
  # credentials and has no id-token permission, so a malicious PR cannot reach
  # Google Cloud. This is why build-and-push is a separate job.
  # ---------------------------------------------------------------------------
  verify:
    name: typecheck and scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Don't leave a usable GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Must match the Dockerfile base. `engines.node` is ">=20", which a
          # node-version-file would resolve to the newest LTS and silently drift.
          node-version: "22"
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      # The only real quality gate in this repo. tsc runs with strict and
      # noUncheckedIndexedAccess, and it type-checks and emits in one pass.
      # There is deliberately no `npm test` or `npm run lint` — neither script
      # exists, so invoking them would fail.
      - name: typecheck and build
        run: npm run build

      - name: build image for scanning
        run: docker build --load -t fcr-monitor:scan .

      # Trivy runs as a digest-pinned container rather than via
      # aquasecurity/trivy-action: that action shells out to an install script
      # which queries the GitHub API to resolve the release, is rate-limited on
      # shared runners, and failed here before it had even fetched the
      # vulnerability DB. A security gate that breaks for non-security reasons
      # teaches people to delete the gate.
      #
      # It scans the FLATTENED filesystem (docker export + trivy rootfs), not a
      # `docker save` layer tarball. This matters: the Dockerfile deletes npm from
      # the runtime stage, but `rm` only writes a whiteout — the files remain in
      # the underlying base-image layer. Scanning layers therefore reports CVEs in
      # npm's bundled dependencies (tar, sigstore, brace-expansion, picomatch)
      # that are not present in, and cannot be executed by, the running
      # container. `docker export` applies whiteouts, so this scans exactly what
      # the container actually has.
      - name: scan image
        env:
          TRIVY_IMAGE: aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436
        run: |
          set -euo pipefail
          cid="$(docker create fcr-monitor:scan)"
          mkdir -p "${RUNNER_TEMP}/rootfs"
          docker export "$cid" | tar -x -C "${RUNNER_TEMP}/rootfs"
          docker rm -f "$cid" >/dev/null
          docker run --rm \
            -v "${RUNNER_TEMP}/rootfs:/rootfs:ro" \
            "${TRIVY_IMAGE}" rootfs /rootfs \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress

  # ---------------------------------------------------------------------------
  # publish — only on main and version tags. Never on pull_request, so a fork
  # can never obtain the OIDC token.
  # ---------------------------------------------------------------------------
  publish:
    name: build and push
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Keyless auth via Workload Identity Federation — no service-account key
      # exists to leak. The provider's attribute_condition restricts the exchange
      # to this repository and to main/tags; see the infra repo's github_oidc.tf.
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.AR_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # Releases are promoted, never rebuilt. A rebuild of the same commit is not
      # byte-identical (the provenance and SBOM attestations record the run), so
      # it would be a different image from the one main built, scanned and
      # signed, and pushing it as `sha-<commit>` would collide with main's
      # immutable tag. So only main ever builds; a `v*` tag run finds main's
      # image of its commit and adds the version tag to that exact digest.
      #
      # gcloud is preinstalled on the runner and the auth step above has already
      # pointed it at the WIF credentials, so no setup-gcloud.
      - id: existing
        name: find the published image of this commit
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            # Git allows tag names like `v1$(x)` or `v9|v1.0.0`. Nothing here
            # evaluates them, but a release tag has no reason to be anything but
            # semver, so refuse the rest outright.
            if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::${version} is not a semver release tag (vX.Y.Z or vX.Y.Z-pre)"
              exit 1
            fi
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi
          sha_tag="sha-${GITHUB_SHA::12}"
          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"
          # Empty means not published. An API error fails the step rather than
          # being mistaken for "not published".
          digest="$(gcloud artifacts docker tags list "${IMAGE}" \
            --filter="tag~/tags/${sha_tag}\$" --format='value(version)')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "${sha_tag}: ${digest:-not published}"

      - name: refuse to release a commit main has not published
        if: startsWith(github.ref, 'refs/tags/') && steps.existing.outputs.digest == ''
        run: |
          echo "::error::sha-${GITHUB_SHA::12} does not exist. A release must be a commit on main whose publish-image run has succeeded; tag one of those, or re-run this job once main's run for this commit is green."
          exit 1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: "!startsWith(github.ref, 'refs/tags/') && steps.existing.outputs.digest == ''"

      - id: build
        if: "!startsWith(github.ref, 'refs/tags/') && steps.existing.outputs.digest == ''"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          # Immutable, content-addressed tag only. Never `latest`: the Artifact
          # Registry repo has immutable_tags = true, and the deployment pins a
          # digest, so a moving tag would be both rejected and useless.
          tags: ${{ env.IMAGE }}:${{ steps.existing.outputs.sha_tag }}
          # SLSA provenance and an SBOM, both attached to the image in AR.
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless signature bound to this workflow's OIDC identity, so the infra
      # repo can verify where a digest came from before pinning it.
      - name: sign the image
        if: "!startsWith(github.ref, 'refs/tags/') && steps.existing.outputs.digest == ''"
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      # Covers both a release and a re-run of main on an already-published
      # commit. It proves main's own run of this workflow signed this digest at
      # this exact commit, so nothing else that carries the sha- tag (a human
      # push, say) can be released. An unsigned image is never re-signed here:
      # that would vouch for bytes this run did not build.
      - name: verify main signed the published image
        if: steps.existing.outputs.digest != ''
        env:
          DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          set -euo pipefail
          if ! cosign verify "${IMAGE}@${DIGEST}" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-image.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-sha "${GITHUB_SHA}" >/dev/null; then
            echo "::error::${IMAGE}@${DIGEST} is not signed by main's publish-image run at ${GITHUB_SHA}. It cannot be released; push a new commit to main."
            exit 1
          fi

      # Adds a tag and nothing else, server side: the digest, its signature and
      # its attestations stay exactly the ones main produced. Do not swap this
      # for `docker buildx imagetools create` or a pull/tag/push, which can
      # re-serialise the index into a new digest and orphan the signature.
      - name: promote the published image
        if: startsWith(github.ref, 'refs/tags/') && steps.existing.outputs.digest != ''
        env:
          DIGEST: ${{ steps.existing.outputs.digest }}
          VERSION: ${{ steps.existing.outputs.version }}
        run: |
          set -euo pipefail
          # Exact match on the tag's last path segment, not a --filter regex, in
          # which the dots of a version would be wildcards.
          current="$(gcloud artifacts docker tags list "${IMAGE}" --format='value(tag,version)' \
            | awk -F'\t' -v want="${VERSION}" '{ n = $1; sub(/.*\//, "", n) } n == want { print $2 }')"
          # Re-runs: already on this digest is success. On another digest it is a
          # real conflict, and immutable tags would refuse to move it anyway.
          if [[ "${current}" == "${DIGEST}" ]]; then
            echo "${VERSION} already points at ${DIGEST}"
          elif [[ -n "${current}" ]]; then
            echo "::error::${VERSION} already points at ${current}, not ${DIGEST}"
            exit 1
          else
            gcloud artifacts docker tags add "${IMAGE}@${DIGEST}" "${IMAGE}:${VERSION}"
          fi

      - name: summary
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
          VERSION: ${{ steps.existing.outputs.version }}
          BUILT: ${{ steps.existing.outputs.digest == '' }}
        run: |
          label="${VERSION:-sha-${GITHUB_SHA::12}}"
          {
            if [[ -n "${VERSION}" ]]; then
              echo "### Released \`${VERSION}\`"
              echo
              echo "No rebuild: \`${VERSION}\` was added to main's image of this commit (\`sha-${GITHUB_SHA::12}\`)."
            elif [[ "${BUILT}" == true ]]; then
              echo "### Image published"
            else
              echo "### Already published"
              echo
              echo "\`sha-${GITHUB_SHA::12}\` existed and is signed by main, so nothing was rebuilt."
            fi
            echo
            echo "To deploy, set this in \`terraform.tfvars\` of"
            echo "\`production/google/deployments/gnosis-chain/mainnet/tools/fcr-monitor/\`"
            echo "in the \`infrastructure-gnosis\` repo, then open a PR:"
            echo '```hcl'
            echo "image_tag = \"${label}@${DIGEST}\""
            echo '```'
            echo
            echo "Verify the signature first with:"
            echo '```'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-image.yml@refs/heads/main \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-github-workflow-sha ${GITHUB_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
