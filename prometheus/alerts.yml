groups:
  - name: fcr
    rules:
      # Two rules, split by the `severity` label the monitor puts on the series.
      # `severityOf` in src/events.ts is the single definition; nothing here repeats it.
      #
      # Only a hash changing at a height already recorded as safe proves a confirmed block
      # was lost. The `safe` tag moving backwards does not: the fast confirmation rule
      # reverts to the finalized checkpoint by design, and a syncing node or an execution
      # client restart produces the same move with nothing on chain behind it.
      #
      # Fires per offending block rather than per client, so the block number and both
      # hashes ride the alert's labels into the notification.
      - alert: FcrConfirmedBlockReorged
        expr: fcr_fallback_event_info{severity="critical"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.type }} on {{ $labels.client }} at block {{ $labels.block_number }}"
          description: >-
            Block {{ $labels.block_number }} was confirmed as {{ $labels.recorded_hash }}
            and is now {{ $labels.observed_hash }}. A block confirmed by the fast
            confirmation rule was reorged out. See the Alerts tab on the monitor.

      # Evaluates and is visible at :9090/alerts, but is not routed to a notifier.
      # Useful signal, not an incident: one client withdrawing while the other does not,
      # with both still up, is the signature of a struggling execution client.
      - alert: FcrConfirmationWithdrawn
        expr: fcr_fallback_event_info{severity="warning"} == 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.client }} withdrew its confirmation at block {{ $labels.block_number }}"
          description: >-
            The safe tag on {{ $labels.client }} moved backwards. No block was reorged --
            the fast confirmation rule reverted to finality, or the node is syncing, or its
            execution client restarted. Recorded for diagnosis only.

      - alert: FcrClientDown
        expr: fcr_client_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.client }} execution RPC unreachable"

      - alert: FcrClientDivergence
        expr: fcr_client_divergence == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nimbus and Lodestar disagree on the {{ $labels.tag }} block hash"

      - alert: FcrSafeStalled
        expr: fcr_block_age_seconds{tag="safe"} > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Safe block on {{ $labels.client }} has not advanced for over two minutes"

      - alert: FcrFinalizationStalled
        expr: fcr_block_age_seconds{tag="finalized"} > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Finalization on {{ $labels.client }} is more than 15 minutes behind"

      - alert: FcrMonitorStale
        expr: time() - fcr_last_poll_timestamp_seconds > 60
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Monitor has not completed a poll of {{ $labels.client }} in over a minute"
