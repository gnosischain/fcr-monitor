global:
  scrape_interval: 12s
  evaluation_interval: 12s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: fcr-monitor
    static_configs:
      # 9100, not 3000: /metrics is served on its own listener so the port that
      # faces users never exposes it. See createMetricsServer() in src/server.ts.
      - targets: ["monitor:9100"]
